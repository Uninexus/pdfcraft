[package]
name = "pdfcraft-ai"
description = "Opt-in AI assistant client: talks to any OpenAI-compatible chat endpoint (a local model server or a hosted API)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "_ring", "gzip", "platform-verifier"] }

[dev-dependencies]
tempfile = "3.27"
